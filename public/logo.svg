<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Lotus Flower and Silhouette -->
  <g transform="translate(250, 220)">
    <!-- Back Petals (Light Blue) -->
    <path d="M0,0 C20,30 40,60 10,-20 C-20,60 0,30 0,0 Z" fill="#b0c4de" opacity="0.6"/>
    <path d="M0,0 C-30,20 -60,40 -20,-10 C-60,40 -30,20 0,0 Z" fill="#b0c4de" opacity="0.6"/>
    <path d="M0,0 C30,20 60,40 20,-10 C60,40 30,20 0,0 Z" fill="#b0c4de" opacity="0.6"/>
    
    <!-- Woman Silhouette Outline -->
    <path d="M-15,-80 C-5,-90 5,-90 15,-80 C20,-60 25,-40 30,10 C15,0 -15,0 -30,10 C-25,-40 -20,-60 -15,-80 Z" fill="none" stroke="#4682B4" stroke-width="2"/>
    <path d="M0,-95 C-10,-95 -15,-85 -15,-75 C-5,-70 5,-70 15,-75 C15,-85 10,-95 0,-95 Z" fill="none" stroke="#4682B4" stroke-width="2"/>
    <path d="M-12,-82 C-25,-70 -35,-40 -35,-10" fill="none" stroke="#4682B4" stroke-width="2"/>
    <path d="M12,-82 C25,-70 35,-40 35,-10" fill="none" stroke="#4682B4" stroke-width="2"/>

    <!-- Front Lotus Petals (Turquoise) -->
    <path d="M0,50 C30,20 30,-10 0,-40 C-30,-10 -30,20 0,50 Z" fill="#20B2AA"/>
    <path d="M0,50 C40,40 60,10 30,-20 C30,20 10,40 0,50 Z" fill="#20B2AA"/>
    <path d="M0,50 C-40,40 -60,10 -30,-20 C-30,20 -10,40 0,50 Z" fill="#20B2AA"/>
    <path d="M0,50 C60,50 80,30 50,0 C50,30 20,40 0,50 Z" fill="#20B2AA"/>
    <path d="M0,50 C-60,50 -80,30 -50,0 C-50,30 -20,40 0,50 Z" fill="#20B2AA"/>
    <path d="M0,50 C70,60 90,40 70,20 C70,40 40,50 0,50 Z" fill="#20B2AA"/>
    <path d="M0,50 C-70,60 -90,40 -70,20 C-70,40 -40,50 0,50 Z" fill="#20B2AA"/>
  </g>

  <!-- Typography -->
  <text x="250" y="340" font-family="'Times New Roman', serif" font-size="72" fill="#374151" text-anchor="middle" letter-spacing="12">ALFRA</text>
  <text x="250" y="380" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#f472b6" text-anchor="middle" letter-spacing="4">CIRUGÍA Y MEDICINA ESTÉTICA</text>
</svg>
